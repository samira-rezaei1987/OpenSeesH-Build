name: Build OpenSeesH MSBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Tcl/Tk 8.6
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          git clone --depth 1 --branch core-8-6-18 https://github.com/tcltk/tcl.git C:\tcl-src
          git clone --depth 1 --branch core-8-6-18 https://github.com/tcltk/tk.git C:\tk-src

          cd /d C:\tcl-src\win
          nmake -f makefile.vc release MACHINE=AMD64
          nmake -f makefile.vc install MACHINE=AMD64 INSTALLDIR="C:\Program Files\tcl"

          cd /d C:\tk-src\win
          nmake -f makefile.vc release MACHINE=AMD64 TCLDIR=C:\tcl-src
          nmake -f makefile.vc install MACHINE=AMD64 TCLDIR=C:\tcl-src INSTALLDIR="C:\Program Files\tcl"

      - name: Prepare project
        shell: powershell
        run: |
          Write-Host "Extracting bundled Fortran libraries..."
          Expand-Archive -Path "Win64\lib\externalLibs.zip" -DestinationPath "Win64\lib" -Force

          Write-Host "Changing Visual Studio toolset to v143..."
          Get-ChildItem "Win64\proj" -Recurse -Filter *.vcxproj | ForEach-Object {
              $file = $_.FullName
              $txt = Get-Content $file -Raw
              $txt = $txt -replace '<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>'
              $txt = $txt -replace '<PlatformToolset>v142</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>'
              Set-Content $file $txt
          }
          Write-Host "Redirecting OpenSeesH output into repository..."
          $openSeesProject = "Win64\proj\openSees\OpenSees.vcxproj"
          $txt = Get-Content $openSeesProject -Raw
          $txt = $txt -replace 'C:\\Users\\Alireza\\AppData\\Roaming\\OpenSees House\\OpenSeesH\\bin', '..\..\bin\release'
          Set-Content $openSeesProject $txt

      - name: Build
        shell: cmd
        run: |
          msbuild -noAutoResponse Win64\OpenSees.sln /m /t:OpenSees /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Find executable
        if: always()
        shell: powershell
        run: |
          Get-ChildItem . -Recurse -Filter "OpenSeesH.exe" -ErrorAction SilentlyContinue |
          Select-Object FullName,Length,LastWriteTime

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSeesH-MSBuild
          path: |
            Win64/bin/**/*.exe
